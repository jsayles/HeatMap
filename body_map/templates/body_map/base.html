{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}Personal Heat Map{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'body_map/app.css' %}">
</head>
<body>
  <header>
    <a class="brand" href="{% url 'home' %}">Personal Heat Map</a>
    <nav>
      <a href="{% url 'import_portrait' %}">Import portrait</a>
      <a href="{% url 'admin:body_map_subject_changelist' %}">Subjects</a>
    </nav>
  </header>
  <main>
    {% for message in messages %}<p class="message">{{ message }}</p>{% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
